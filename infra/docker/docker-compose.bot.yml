# VirtualWait QQ 机器人（NapCat + NoneBot2）docker-compose。
# 开箱即用：内置公开的国服 SDGB 默认参数，唯一手动步骤是扫码登录机器人 QQ。
# 用法：cd infra/docker && docker compose -f docker-compose.bot.yml up -d --build
# 使用已发布镜像（非本地源码）时：docker compose -f docker-compose.bot.yml up -d --no-build
# Web（apps/web）需另行部署；若要启用队列叫号，再在 infra/docker/.env 里配 BOT_API_TOKEN。
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      # 预置 OneBot v11 正向 WebSocket 服务端（0.0.0.0:3001）。
      # MODE=ws 把 /app/templates/ws.json 复制为 onebot11.json，登录 QQ 后自动生效。
      MODE: ws
      WEBUI_TOKEN: "${WEBUI_TOKEN:-napcat}"
    ports:
      # NapCat WebUI：本机扫码登录机器人 QQ。
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat_qq:/app/.config/QQ
      - napcat_config:/app/napcat/config

  virtualwait-bot:
    # 默认使用 Docker Hub 预构建镜像 bad0rang3/maidxtool:latest（docker pull 后免构建）；
    # 源码部署或改代码时保留 build 段，执行 docker compose up -d --build。
    # 换用离线包镜像或其它仓库时用 VIRTUALWAIT_BOT_IMAGE 覆盖（如 virtualwait-bot:latest）。
    image: ${VIRTUALWAIT_BOT_IMAGE:-bad0rang3/maidxtool:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DRIVER: "~httpx+~websockets"
      # 连接 NapCat 的 OneBot v11 正向 WebSocket（MODE=ws 预置的 3001 服务端）。
      ONEBOT_WS_URLS: '["ws://napcat:3001"]'
      B50_DATA_DIR: /data
      # 队列空闲通知（留空则通知插件退避，B50/FP 命令不受影响）
      QUEUE_NOTIFY_BASE_URL: "${QUEUE_NOTIFY_BASE_URL:-http://web:3000}"
      QUEUE_NOTIFY_BOT_TOKEN: "${QUEUE_NOTIFY_BOT_TOKEN:-}"
      QUEUE_NOTIFY_DEFAULT_GROUP: "${QUEUE_NOTIFY_DEFAULT_GROUP:-}"
      QUEUE_NOTIFY_ROUTING: "${QUEUE_NOTIFY_ROUTING:-{}}"
      # SDGB 配置：镜像已内置公开的国服协议默认值（见 packages/sdgb-client/sdgb/settings.py），
      # 无需任何配置即可用；下面仅为可覆盖项（换机厅/换版本时再改）。
      VW_SDGB_AIME_URL: "${VW_SDGB_AIME_URL:-http://ai.sys-allnet.cn/wc_aime/api/get_data}"
      VW_SDGB_TITLE_SERVER_URL: "${VW_SDGB_TITLE_SERVER_URL:-https://maimai-gm.wahlap.com:42081/Maimai2Servlet}"
      VW_SDGB_AIME_SALT: "${VW_SDGB_AIME_SALT:-XcW5FW4cPArBXEk4vzKz3CIrMuA5EVVW}"
      VW_SDGB_AES_KEY: "${VW_SDGB_AES_KEY:-n7bx6:@Fg_:2;5E89Phy7AyIcpxEQ:R@}"
      VW_SDGB_AES_IV: "${VW_SDGB_AES_IV:-;;KjR1C3hgB1ovXa}"
      VW_SDGB_OBFUSCATE_PARAM: "${VW_SDGB_OBFUSCATE_PARAM:-BEs2D5vW}"
      VW_SDGB_KEYCHIP_ID: "${VW_SDGB_KEYCHIP_ID:-A63E-01C28055905}"
      VW_SDGB_CLIENT_ID: "${VW_SDGB_CLIENT_ID:-A63E01C2805}"
      VW_SDGB_REGION_ID: "${VW_SDGB_REGION_ID:-1}"
      VW_SDGB_PLACE_ID: "${VW_SDGB_PLACE_ID:-1403}"
    # 无入站端口：机器人出站连接 NapCat WebSocket。
    volumes:
      - b50_data:/data

volumes:
  napcat_qq:
  napcat_config:
  b50_data: