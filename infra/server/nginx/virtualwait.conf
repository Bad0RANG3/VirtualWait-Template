# -----------------------------------------------------------------------
# VirtualWait production TLS template.
# Replace wait.example.com, certificate paths, and ssl_ciphers before
# enabling.  All non-TLS traffic is redirected to HTTPS.
# -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name wait.example.com;

    # Redirect every plain-text request to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wait.example.com;

    # --- TLS configuration (replace with real paths) -------------------
    ssl_certificate     /etc/ssl/certs/wait.example.com.pem;
    ssl_certificate_key /etc/ssl/private/wait.example.com.key;

    # Modern intermediate config — tune to your policy.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS — the whole site (all paths) is served over HTTPS only, so the
    # browser can pin the scheme.  Keep the long max-age for production.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Health probes run from the same host via 127.0.0.1. Do not turn this
    # process/SQLite readiness endpoint into an Internet-facing API.
    location = /api/healthz {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
