[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdgb-client"
version = "0.1.0"
description = "Shared maimai DX SDGB client (crypto pipeline, QR exchange, B50, write ops) for VirtualWait"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pycryptodome>=3.20",
  "pytz",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["sdgb"]

[tool.setuptools.package-data]
sdgb = ["py.typed"]