[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualwait-bot"
version = "0.1.0"
description = "VirtualWait QQ bot (NoneBot2 + OneBot v11): B50/FP commands and queue idle notify"
requires-python = ">=3.10"
dependencies = [
  "nonebot2>=2.0.0",
  "nonebot-adapter-onebot>=2.4.0",
  "httpx>=0.27",
  "pycryptodome>=3.20",
  "pytz",
  "websockets>=10.0",
]

[tool.setuptools]
packages = ["plugins"]