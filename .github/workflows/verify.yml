name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: https://wait.example.test
      GATEWAY_MODE: remote
      # Production supports the documented private same-host Gateway hop;
      # preflight/build here exercise that exception rather than remote HTTP.
      GATEWAY_BASE_URL: http://127.0.0.1:8787
      TRUST_PROXY_HEADERS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Reject leaked secrets and runtime files
        run: |
          if grep -rIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
              --exclude=verify.yml --exclude=preflight.mjs \
              -e 'FKM2JX' -e 'XcW5FW4cPArBXEk4vzKz3CIrMuA5EVVW' -e 'A63E-01C28055905' .; then
            echo "Hardcoded SDGB secret material detected in checkout" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(napcat/|token_cache\.json|records_cache\.json|webui\.json)$|(^|/)data/' ; then
            echo "Local runtime/secret files are tracked in git" >&2
            exit 1
          fi
      - name: Reject disabled TLS verification
        run: |
          if grep -rn "verify=False" --include='*.py' packages services; then
            echo "TLS certificate verification must stay enabled for SDGB/AiMe requests" >&2
            exit 1
          fi
      - name: Create ephemeral verification secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "PUBLIC_ID_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "GATEWAY_SHARED_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_API_TOKEN=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify Web and HTTP E2E
        working-directory: apps/web
        run: |
          npm run preflight -- --production
          npm run preflight -- --browser
          npm test
          npm run test:e2e
          npm run test:browser
          npm run lint
          npx tsc --noEmit
          npm run build
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          VIRTUALWAIT_DATA_DIR="$backup_dir/data" npm run db:backup -- --output "$backup_dir/virtualwait.db"
          npm run db:verify -- --input "$backup_dir/virtualwait.db"
          npm audit --omit=dev --package-lock-only --audit-level=high
      - name: Verify systemd templates
        run: systemd-analyze verify infra/server/systemd/virtualwait-*.service infra/server/systemd/virtualwait-*.timer
      - name: Verify server environment examples
        run: node infra/server/scripts/verify-server-env-examples.mjs
      - name: Verify Nginx template
        run: node infra/server/scripts/verify-nginx-template.mjs
      - name: Verify Gateway
        working-directory: services/sdgb-gateway
        run: |
          python -m pip install '.[test]'
          PYTHONPATH=src pytest -q
      - name: Verify QQ bot and shared sdgb-client
        run: |
          python -m pip install pytest
          python -m pip install -e './packages/sdgb-client[test]'
          python -m compileall -q packages/sdgb-client services/bot
          PYTHONPATH=packages/sdgb-client pytest -q packages/sdgb-client/tests
          PYTHONPATH=services/bot pytest -q services/bot/tests
