name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: https://wait.example.test
      TRUST_PROXY_HEADERS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Reject runtime files
        run: |
          if git ls-files | grep -E '(^|/)(napcat/|webui\.json)$|(^|/)data/' ; then
            echo "Local runtime/secret files are tracked in git" >&2
            exit 1
          fi
      - name: Reject retired Gateway/provider settings
        run: |
          # *.test.ts files are part of the detectors: they assert that the
          # legacy columns/tables are gone, so they must name them. Every other
          # file must not mention the retired settings.
          if grep -rInE 'GATEWAY_SHARED_SECRET|PUBLIC_ID_HMAC_SECRET|VW_GATEWAY_|VW_SDGB_|sdgb_identity_hash' \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
              --exclude=verify.yml \
              --exclude=preflight.mjs \
              --exclude=verify-server-env-examples.mjs \
              --exclude='*.test.ts' . ; then
            echo "Removed external-identity settings must not come back" >&2
            exit 1
          fi
      - name: Create ephemeral verification secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_API_TOKEN=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify Web and HTTP E2E
        working-directory: apps/web
        run: |
          npm run preflight -- --production
          npm run preflight -- --browser
          npm test
          npm run test:e2e
          npm run test:browser
          npm run lint
          npx tsc --noEmit
          npm run build
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          VIRTUALWAIT_DATA_DIR="$backup_dir/data" npm run db:backup -- --output "$backup_dir/virtualwait.db"
          npm run db:verify -- --input "$backup_dir/virtualwait.db"
          npm audit --omit=dev --package-lock-only --audit-level=high
      - name: Verify systemd templates
        run: systemd-analyze verify infra/server/systemd/virtualwait-*.service infra/server/systemd/virtualwait-*.timer
      - name: Verify server environment examples
        run: node infra/server/scripts/verify-server-env-examples.mjs
      - name: Verify Nginx template
        run: node infra/server/scripts/verify-nginx-template.mjs
      - name: Verify QQ bot
        run: |
          python -m pip install pytest 'nonebot2>=2.0.0' 'nonebot-adapter-onebot>=2.4.0' 'httpx>=0.27' 'websockets>=10.0'
          python -m compileall -q services/bot
          PYTHONPATH=services/bot pytest -q services/bot/tests
